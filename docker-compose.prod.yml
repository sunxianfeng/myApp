version: '3.8'

services:
  # Backend API
  backend:
    image: ghcr.io/sunxianfeng/myapp-backend:latest
    container_name: notebook_backend_prod
    ports:
      - "8000:8000"
    environment:
      # 从 .env 文件读取云服务配置
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./data/generated:/app/generated
    networks:
      - notebook_network
    restart: always

  # Frontend
  frontend:
    image: ghcr.io/sunxianfeng/myapp-frontend:latest
    container_name: notebook_frontend_prod
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - notebook_network
    restart: always

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: notebook_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./data/generated:/var/www/generated:ro
    networks:
      - notebook_network
    restart: always

networks:
  notebook_network:
    driver: bridge
